{% load static %}
<header class="bg-white shrink-0 z-50 relative">
    <div class="container mx-auto px-6 lg:px-12 h-[72px] flex items-center justify-between">
        <div class="flex items-center gap-10">
            <a href="/" class="flex items-center gap-1">
                <img src="{% static 'images/Logo-Header-1.webp' %}" alt="Logo" class="w-[150px] h-auto object-cover">

            <nav class="hidden md:flex items-center gap-8 text-[16px] font-medium text-gray-700">
